<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Orientations</title>
    <link rel="icon" type="image/x-icon" href="Images/New-icon.png" id = "favicon">
    <style>

        @keyframes fade-in {
            from{
                opacity:0;
            }
            to{
                opacity:100;
            }
        }

        .flex-container{
            border: none;
            display:flex;
            flex-wrap:wrap;
            flex-direction:column;
            height: 60px;
            /*border-image: url(Frame.png) 16 round;*/
            border-radius: 5px;
            border-top-right-radius: 0px;
            background-color:rgb(200, 245, 245);
            padding:15px;
            margin:15px;
            margin-top:0px;
        }

        .tab-container{
            margin: 15px;
            margin-bottom: 0px;
            display:flex;
            justify-content: right;
            gap: 0px;
        }

        .custom-tab-selected{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color:rgb(200, 245, 245) ;
            border: 2px solid transparent;
            border-top-right-radius: 5px;
            border-top-left-radius: 5px;
        }

        .custom-tab-unselected{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: rgb(174, 219, 219);
            border: 2px solid transparent;
            border-top-right-radius: 5px;
            border-top-left-radius: 5px;
            transition-duration: 0.4s;
        }

        .custom-tab-unselected:hover{
            background-color: rgb(163, 205, 205);
        }

        .button-container{
            display:flex;
            justify-content: center;
            gap: 10px;
        }

        .custom-button{
            border: none;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            border-radius: 5px;
            transition-duration: 0.4s;
        }

        .custom-button:hover{
            background-color: rgb(221, 221, 221);
            color:auto;
        }

        .fade-in-text{
            animation-name:"fade-in";
            animation-duration: 0.4s;
        }

        #banner{
            display:flex; 
            align-items: center; 
            height:50px; 
            background:url(Images/Pattern.png),linear-gradient(to right, rgb(244, 255, 254) 5%, rgb(169, 222, 222)25%, rgb(120, 158, 158)100%); 
            background-size: 450px, 100%; height:50px;
        }

        #display{
            background-color: rgb(200, 245, 245);
            text-align: center; 
            border: solid 2px transparent; 
            border-radius: 5px; 
            padding:15px; 
            margin:15px;
        }
        
        body{
            background-color:azure; 
            font-family:Verdana, Helvetica, sans-serif;
            padding:0;
            margin:0;
        }

    </style>
</head>
<script src="code.js"></script>
<body onload = "onLoad()">
    <div id="banner">
        <img src = "Images/New-icon.png" width="50px" height="50px" style = "float:left" id = "icon"> 
        <h3 style = "margin:0;"><i>Scale Orientations</i></h3>
    </div>
    
    <hr style = "background-color:rgb(174, 219, 219); height:3px; border:none; margin:0px;">

    <p style="text-align:center; padding: 5px;"> This website generates a list of random scales for practice, scales go up to 4 sharps and 4 flats by default, click generate to make a new random list of scales</p>

    <div class = "tab-container" id = "tabContainer">
        <button class = "custom-tab-selected" type = "button" onclick="OpenContent('preferences',this)">Preferences</button>
        <button class = "custom-tab-unselected" type = "button" onclick="OpenContent('settings',this)">Settings</button>
    </div>

    <div class = "flex-container" id = "preferences">
        <div class = "preferences-check-box">
            <input type = "checkbox" id = "variations">
            <label for = "variations">Variations</label>
        </div>
        <div class = "preferences-check-box">
            <input type = "checkbox" id = "triplet variations">
            <label for = "triplet variations">Triplet Variations</label>
        </div>
        <div class = "preferences-check-box">
            <input type = "checkbox" id = "chromatic">
            <label for = "chromatic">Chromatic</label>
        </div>
        <div class = "preferences-check-box">
            <input type = "checkbox" id = "custom" style = "display:inline-block;">
            <label for = "custom" id = "customLabel" style = "display:inline-block;">Custom</label>
            <input type = "text" id = "customInput"  style = "display:none" value = "C, G, D, A, E, F, Bb, Eb, Ab" style = "display:inline-block;">
        </div>
    </div>

    <div class = "flex-container" style="display: none;" id = "settings">
        <div class = "settings-check-box">
            <input type = "checkbox" id = "animFix">
            <label for = "animFix">Animation Fix</label>
        </div>
        <div class = "settings-check-box">
            <input type = "checkbox" id = "legacyIcon">
            <label for = "legacyIcon">Legacy Icon</label>
        </div>
    </div>

    <div class = "button-container" style = "margin:20px;">
        <button class = "custom-button" type = "button" onclick = "Generate()" style = "width:200px; height:150;">Generate</button>
        <button class = "custom-button" type = "button" onclick = "Clear()" style = "width:200px; height:150;">Clear Selections</button>
    </div>
    <div id="display">
        <p id = "displayText" style = "font-size: 30px; margin:0px"> C<br> G<br> D<br> A<br> E<br> F<br> Bb<br> Eb<br> Ab</p>
    </div>
    <p style = "margin: 10px; font-size: 10px; text-align: center;">This website is made by Cedric Wu, who is a really awesome guy</p>

</body>
</html>
